<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Resume Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(-45deg, #6a11cb, #2575fc, #00c6ff, #7f00ff);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 520px;
    padding: 40px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(18px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    text-align: center;
    color: white;
    animation: fadeIn 1s ease;
}

h1 {
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 12px;
}

.subtitle {
    font-size: 15px;
    line-height: 1.6;
    opacity: 0.9;
    margin-bottom: 30px;
}

.upload-box {
    border: 2px dashed rgba(255,255,255,0.6);
    padding: 35px;
    border-radius: 18px;
    transition: all 0.4s ease;
    cursor: pointer;
    background: rgba(255,255,255,0.05);
}

.upload-box:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.1);
    border-color: white;
}

.upload-box h3 {
    margin-bottom: 10px;
    font-size: 22px;
}

.upload-box p {
    font-size: 14px;
    opacity: 0.85;
}

input[type="file"] {
    margin-top: 18px;
    color: white;
    width: 100%;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

button:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 10px 25px rgba(16,185,129,0.4);
}

.loader {
    margin: 30px auto;
    border: 5px solid rgba(255,255,255,0.2);
    border-top: 5px solid white;
    border-radius: 50%;
    width: 55px;
    height: 55px;
    animation: spin 1s linear infinite;
    display: none;
}

.result {
    margin-top: 30px;
    padding: 25px;
    border-radius: 18px;
    background: rgba(0,0,0,0.25);
    display: none;
    animation: fadeInUp 0.6s ease;
    text-align: left;
}

.result h3 {
    font-size: 24px;
    margin-bottom: 20px;
}

.score-card {
    background: rgba(255,255,255,0.12);
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 20px;
    font-size: 18px;
}

.skills {
    margin-top: 20px;
}

.skill-tag {
    display: inline-block;
    padding: 8px 14px;
    margin: 6px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 30px;
    font-size: 13px;
    transition: 0.3s ease;
}

.skill-tag:hover {
    transform: scale(1.05);
    background: rgba(255,255,255,0.25);
}
textarea {
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    resize: none;
    min-height: 120px;
    font-size: 15px;
    outline: none;
    background: rgba(255,255,255,0.12);
    color: white;
    backdrop-filter: blur(8px);
}

textarea::placeholder {
    color: rgba(255,255,255,0.7);
}

@keyframes gradientBG {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(0.95);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes spin {
    100% {
        transform: rotate(360deg);
    }
}

@media(max-width: 600px) {

    .container {
        padding: 28px;
    }

    h1 {
        font-size: 28px;
    }

    .upload-box {
        padding: 25px;
    }
    }
    .upload-icon {
    font-size: 55px;
    margin-bottom: 15px;
    animation: floatIcon 3s ease-in-out infinite;
}

.file-name {
    margin-top: 15px;
    font-size: 14px;
    color: #ffffff;
    opacity: 0.9;
}

.progress-container {
    width: 100%;
    height: 10px;
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    overflow: hidden;
    margin-top: 25px;
    display: none;
}

.progress-bar {
    width: 0%;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #00f5a0, #00d9f5);
    transition: width 0.4s ease;
}

.score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    margin: 20px auto;
    background: conic-gradient(
        #10b981 0% 85%,
        rgba(255,255,255,0.15) 85% 100%
    );
    display: flex;
    justify-content: center;
    align-items: center;
}

.score-inner {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
}

.success-glow {
    box-shadow: 0 0 25px rgba(16,185,129,0.6);
}

.error-glow {
    box-shadow: 0 0 25px rgba(239,68,68,0.6);
}

@keyframes floatIcon {

    0% {
        transform: translateY(0px);
    }

    50% {
        transform: translateY(-8px);
    }

    100% {
        transform: translateY(0px);
    }
}
    </style>
</head>

<body>

    <div class="container">

        <h1>Smart Resume Analyzer</h1>

        <p class="subtitle">
            Upload your resume and get instant AI-powered analysis
        </p>

        <form id="uploadForm">

            <div class="upload-box" id="dropArea">

    <div class="upload-icon">
        ☁️
    </div>

    <h3>Drag & Drop Resume</h3>

    <p>PDF / DOCX supported</p>

    <input type="file" id="file" name="file" hidden required>

    <button type="button" id="browseBtn">
        Browse Files
    </button>

    <div id="fileName" class="file-name"></div>

</div>
<textarea
    id="skillsInput"
    placeholder="Enter required skills separated by commas... 
Example: Java, Spring Boot, Docker, SQL"
    required>
</textarea>

            <button type="submit">
                Analyze Resume
            </button>

        </form>

        <div class="loader" id="loader"></div>

        <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
</div>

        <div class="result" id="resultBox"></div>

    </div>

    <script>

    const dropArea = document.getElementById("dropArea");
    const fileInput = document.getElementById("file");
    const browseBtn = document.getElementById("browseBtn");
    const fileName = document.getElementById("fileName");

    const progressContainer = document.getElementById("progressContainer");
    const progressBar = document.getElementById("progressBar");

    browseBtn.addEventListener("click", () => {
        fileInput.click();
    });

    fileInput.addEventListener("change", () => {
        if (fileInput.files.length > 0) {
            fileName.innerText = fileInput.files[0].name;
        }
    });

    dropArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropArea.style.borderColor = "#ffffff";
    });

    dropArea.addEventListener("dragleave", () => {
        dropArea.style.borderColor = "rgba(255,255,255,0.6)";
    });

    dropArea.addEventListener("drop", (e) => {

        e.preventDefault();

        fileInput.files = e.dataTransfer.files;

        fileName.innerText = e.dataTransfer.files[0].name;
    });

    document.getElementById("uploadForm")
    .addEventListener("submit", async function (e) {

        e.preventDefault();

        const loader = document.getElementById("loader");
        const resultBox = document.getElementById("resultBox");

        loader.style.display = "block";
        resultBox.style.display = "none";

        progressContainer.style.display = "block";

        let progress = 0;

        const fakeProgress = setInterval(() => {

            progress += 10;

            progressBar.style.width = progress + "%";

            if (progress >= 90) {
                clearInterval(fakeProgress);
            }

        }, 250);

        const formData = new FormData();

        
        formData.append("file", fileInput.files[0]);
        const skills = document.getElementById("skillsInput").value;

        formData.append("skills", skills);
        try {

            const response = await fetch("/match", {
                method: "POST",
                body: formData
            });

            const result = await response.json();

            clearInterval(fakeProgress);

            progressBar.style.width = "100%";

            setTimeout(() => {

                loader.style.display = "none";

                resultBox.style.display = "block";

                resultBox.classList.add("success-glow");

                resultBox.innerHTML = `

                    <h3>Analysis Complete</h3>

                    <div class="score-circle">

                        <div class="score-inner">
                            ${result.score}%
                        </div>

                    </div>

                    <div class="score-card">
                        Resume matched successfully with job requirements.
                    </div>

                    <p><strong>Matched Skills:</strong></p>

                    <div class="skills">
                        ${result.matchedSkills.map(skill =>
                            `<span class="skill-tag">${skill}</span>`
                        ).join("")}
                    </div>

                    <br>

                    <p><strong>Missing Skills:</strong></p>

                    <div class="skills">
                        ${result.missingSkills.map(skill =>
                            `<span class="skill-tag">${skill}</span>`
                        ).join("")}
                    </div>


                `;

            }, 500);

        } catch (error) {

            loader.style.display = "none";

            resultBox.style.display = "block";

            resultBox.classList.add("error-glow");

            resultBox.innerHTML = `
                <h3>Error</h3>
                <p>Resume analysis failed.</p>
            `;
        }

    });

</script>

</body>

</html>
